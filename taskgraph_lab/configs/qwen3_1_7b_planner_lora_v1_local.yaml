model:
  model_dir: D:/Desktop/tzb-2026/Qwen3-1.7B
  local_files_only: true
  trust_remote_code: true
  torch_dtype: bfloat16
  attention_backend: sdpa
data:
  train_file: taskgraph_lab/data/planner_sft_v1/train.jsonl
  validation_file: taskgraph_lab/data/planner_sft_v1/validation.jsonl
  dataset_manifest: taskgraph_lab/data/planner_sft_v1/dataset_manifest.json
  max_seq_length: 1088
training:
  output_dir: taskgraph_lab/outputs/training/qwen3_1_7b_planner_lora_v1
  num_train_epochs: 3.0
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.05
  lr_scheduler_type: cosine
  logging_steps: 1
  eval_steps: 25
  save_steps: 25
  save_total_limit: 2
  max_grad_norm: 1.0
  bf16: true
  gradient_checkpointing: true
  seed: 42
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

