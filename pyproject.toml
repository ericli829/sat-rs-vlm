[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sat-rs-vlm"
version = "0.1.0"
description = "Multimodal remote-sensing VLM engineering framework for constrained satellite deployment."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]
model = [
    "torch>=2.0",
    "torchvision>=0.15",
    "transformers>=4.40",
    "accelerate>=0.30",
    "peft>=0.10",
    "bitsandbytes>=0.43",
    "safetensors>=0.4",
    "pillow>=10.0",
    "qwen-vl-utils>=0.0.8",
]

[project.scripts]
sat-rs-vlm = "sat_rs_vlm.interfaces.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
packages = ["sat_rs_vlm"]
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true
