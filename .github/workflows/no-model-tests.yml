name: No-model regression tests

on:
  push:
    branches:
      - codex/competition-protocol-v2
  pull_request:
    branches:
      - codex/competition-protocol-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-model-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      RUN_REAL_MODEL_TESTS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test dependencies (without model extras)
        run: python -m pip install -e ".[dev]"
      - name: Run fake-provider and contract regression tests
        run: >-
          python -m pytest -q --basetemp=/tmp/sat-rs-vlm-no-model-tests
          tests/unit/taskgraph/test_georsclip_verification.py
          tests/unit/competition/test_protocol_v2.py
          tests/unit/competition/test_bbox_planner_contract.py
          tests/unit/taskgraph/test_runtime_memory_hashes.py
          tests/unit/taskgraph/test_qwen3vl_shared.py
