# E1d-combined: detection/counting 配额数据与加权 sampler 同时启用。
model:
  model_dir: "${MODEL_ROOT}/Qwen3-VL-2B-Instruct"
  processor_dir: "${MODEL_ROOT}/Qwen3-VL-2B-Instruct"
  local_files_only: true
  torch_dtype: "bfloat16"
  device_map: "auto"
data:
  train_file: "data/processed/e1/qwen3vl_train_detection_focus_8k.jsonl"
  val_file: "data/processed/e1/qwen3vl_val_balanced_1k.jsonl"
  image_root: "${DATA_ROOT}/VRSBench"
  max_seq_length: 1024
  data_composition: "detection_quota"
  sampling_mode: "weighted"
  task_sampling_weights:
    detection: 2.0
    counting: 1.5
    captioning: 0.8
    vqa: 0.8
    scene_classification: 0.8
training:
  output_dir: "${OUTPUT_ROOT}/training/e1d-combined"
  method: "lora"
  num_train_epochs: 2
  gradient_accumulation_steps: 8
  learning_rate: 0.0001
lora:
  r: 16
  alpha: 32
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
evaluation:
  do_eval: true
  predict_with_generate: false
logging:
  experiment_name: "e1d-combined"
