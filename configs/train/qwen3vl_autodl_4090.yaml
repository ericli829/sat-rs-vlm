# AutoDL RTX 4090 LoRA 正式训练配置；路径全部由 environments/autodl.env 提供。
model:
  model_dir: "${LOCAL_MODEL_DIR}"
  processor_dir: "${LOCAL_MODEL_DIR}"
  local_files_only: true
  trust_remote_code: true
  torch_dtype: "bfloat16"
  attn_implementation: "sdpa"
  device_map: "auto"

data:
  train_file: "${TRAIN_JSONL}"
  val_file: "${VAL_JSONL}"
  image_root: "${DATA_ROOT}"
  max_seq_length: 1024
  max_train_samples: null
  max_eval_samples: 1024
  skip_bad_samples: false
  data_composition: "full"
  sampling_mode: "uniform"
  task_sampling_weights: {}

training:
  output_dir: "${OUTPUT_ROOT}/checkpoints/lora/autodl_4090_full"
  method: "lora"
  freeze_vision_encoder: true
  freeze_projector: false
  num_train_epochs: 2
  max_steps: null
  per_device_train_batch_size: 16
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 1
  learning_rate: 0.0001
  weight_decay: 0.01
  warmup_ratio: 0.03
  lr_scheduler_type: "cosine"
  logging_steps: 20
  eval_steps: 1000
  save_steps: 500
  save_total_limit: 3
  bf16: true
  fp16: false
  gradient_checkpointing: true
  dataloader_num_workers: 8
  dataloader_pin_memory: true
  dataloader_persistent_workers: true
  max_grad_norm: 1.0
  seed: 42
  resume_from_checkpoint: null

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

qlora:
  load_in_4bit: false
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_use_double_quant: true

evaluation:
  do_eval: true
  predict_with_generate: true
  max_new_tokens: 256
  num_beams: 1

logging:
  report_to: "none"
  experiment_name: "autodl_lora_4090_full"
