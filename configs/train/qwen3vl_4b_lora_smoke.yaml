# Two-step Qwen3-VL 4B LoRA smoke test. This never reuses a 2B adapter.
model:
  model_dir: "${QWEN3VL_4B_MODEL_DIR}"
  processor_dir: "${QWEN3VL_4B_MODEL_DIR}"
  local_files_only: true
  trust_remote_code: true
  torch_dtype: "bfloat16"
  attn_implementation: "sdpa"
  device_map: "auto"

data:
  train_file: "data/processed/multisource/vrsbench_levircc_train.jsonl"
  val_file: "data/processed/multisource/vrsbench_levircc_val.jsonl"
  image_root: "${DATA_ROOT}"
  max_seq_length: 1024
  max_train_samples: 4
  max_eval_samples: 2
  skip_bad_samples: false
  data_composition: "full"
  sampling_mode: "uniform"
  task_sampling_weights: {}
  source_batch_pattern: []

training:
  output_dir: "${OUTPUT_ROOT}/checkpoints/lora/qwen3vl_4b/smoke"
  method: "lora"
  freeze_vision_encoder: true
  freeze_projector: false
  num_train_epochs: null
  max_steps: 2
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 1
  learning_rate: 0.0001
  weight_decay: 0.01
  warmup_ratio: 0.0
  lr_scheduler_type: "cosine"
  logging_steps: 1
  save_steps: 1
  eval_steps: 1
  save_total_limit: 1
  bf16: true
  fp16: false
  gradient_checkpointing: true
  dataloader_num_workers: 2
  dataloader_pin_memory: true
  dataloader_persistent_workers: true
  max_grad_norm: 1.0
  seed: 42
  resume_from_checkpoint: null

lora:
  initial_adapter_dir: null
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

qlora:
  load_in_4bit: false
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_use_double_quant: true

loss:
  mode: "task_weighted"
  task_weights:
    captioning: 1.0
    detection: 1.0
    counting: 1.0
    scene_classification: 1.0
    vqa: 1.0
    change_detection: 1.0
  unknown_task_weight: 1.0
  strict_task_metadata: true

vision_tuning:
  enabled: false
  unfreeze_last_n_blocks: 2
  train_main_merger: false
  train_deepstack_mergers: false
  train_patch_embed: false

evaluation:
  do_eval: true
  predict_with_generate: true
  max_new_tokens: 64
  num_beams: 1

logging:
  report_to: "none"
  experiment_name: "qwen3vl_4b_lora_smoke"
