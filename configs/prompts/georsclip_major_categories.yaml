version: 1

# Fixed class nouns for the coarse GeoRSCLIP screen. No random or per-crop
# negative-term selection is performed. Each term receives all three templates.
templates:
  - "satellite imagery of a {term}."
  - "aerial photograph of a {term} viewed from above."
  - "an overhead remote sensing image showing a {term}."

