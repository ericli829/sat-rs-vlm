dataset_policy:
  MME_RealWorld_RS:
    default: TASKGRAPH_UHR
  XLRS_Bench:
    default: TASKGRAPH_UHR

providers:
  detection:
    kind: tiled
    tile_size: 1333
    overlap_ratio: 0.15
    global_nms_iou: 0.4
    base_provider: lae_dino_lae1m
    base_config:
      source_root: ${LAE_DINO_SOURCE_ROOT}
      config_path: ${LAE_DINO_CONFIG_LAE1M}
      checkpoint: ${LAE_DINO_CHECKPOINT_LAE1M}
      bert_root: ${LAE_DINO_BERT_ROOT}
      worker_python: ${LAE_DINO_PYTHON}
  counting:
    kind: counting_system
    detector:
      kind: lae_dino_lae1m
      source_root: ${LAE_DINO_SOURCE_ROOT}
      config_path: ${LAE_DINO_CONFIG_LAE1M}
      checkpoint: ${LAE_DINO_CHECKPOINT_LAE1M}
      bert_root: ${LAE_DINO_BERT_ROOT}
      worker_python: ${LAE_DINO_PYTHON}
      score_threshold: 0.0
      top_k: 300
    scale:
      global:
        enabled: false
      native:
        enabled: true
        tile_size: 1333
        overlap: 200
      fine:
        enabled: false
    count:
      score_threshold: 0.20
      nms_iou: 0.40
      cross_scale_iou: 0.50
      keep_raw_proposals: true
      max_detections_per_tile: 300
    gate:
      enabled: false
  semantic_2b:
    kind: fake
    default: A
  route_4b:
    kind: fake
    default: A
  choice:
    reuse: semantic_2b
  region_retriever:
    kind: fake
    candidates: []

semantic_region_categories:
  - harbor
  - industrial area
