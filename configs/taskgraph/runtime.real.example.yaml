dataset_policy:
  VRSBench:
    caption: DIRECT_VLM
    captioning: DIRECT_VLM
    vqa: DIRECT_VLM
    visual_question_answering: DIRECT_VLM
    attribute: DIRECT_VLM
    classification: DIRECT_VLM
    count: DIRECT_DETECTION
    counting: DIRECT_DETECTION
    grounding: DIRECT_DETECTION
    visual_grounding: DIRECT_DETECTION
    referring_grounding: DIRECT_DETECTION
    detection: DIRECT_DETECTION
    default: DIRECT_VLM
  LEVIR_CC:
    default: DIRECT_VLM
  MME_RealWorld_RS:
    default: TASKGRAPH_UHR
  XLRS_Bench:
    default: TASKGRAPH_UHR

providers:
  planner:
    kind: qwen3vl_lora
    role: planner_4b
    model_id: ${QWEN3VL_4B_MODEL_DIR}
    adapter_path: ${QWEN3VL_4B_PLANNER_LORA}
    processor_id: ${QWEN3VL_4B_MODEL_DIR}
    device: auto
    dtype: bfloat16
    local_files_only: true
    trust_remote_code: true
    max_new_tokens: 512
    max_prompt_tokens: 2048
    max_attempts: 2
    constrained_decoding: true
    constraint_top_k: 64
    constraint_max_candidate_checks: 256
    constraint_max_nodes: 24
    repeat_guard_repetitions: 4
    max_finish_node_tokens: 32
  detection:
    kind: clip_rerank
    locate_detector:
      score_threshold: 0.15
      max_candidates: 16
      clip_rerank_top_k: 16
    detector_weight: 0.35
    retriever_weight: 0.65
    candidate_top_k: null
    fail_open: true
    retriever:
      provider: georsclip
      config:
        checkpoint: ${GEORSCLIP_CHECKPOINT}
        model_id: GeoRSCLIP-ViT-B-32
        arch: ViT-B-32
        device: auto
        batch_size: 16
        cache_dir: reports/cache/georsclip_detector_rerank
        decoded_image_cache_size: 2
        decoded_image_cache_max_pixels: 4000000
        image_embedding_cache_size: 1024
    base_provider: tiled
    base_config:
      tile_size: 1333
      overlap_ratio: 0.15
      global_nms_iou: 0.4
      parallel_workers: auto
      parallel_max_workers: 3
      parallel_worker_vram_gb: 4.0
      parallel_vram_reserve_gb: 6.0
      proposal_cache_size: 8
      base_provider: lae_dino_lae1m
      base_config:
        source_root: ${LAE_DINO_SOURCE_ROOT}
        config_path: ${LAE_DINO_CONFIG_LAE1M}
        checkpoint: ${LAE_DINO_CHECKPOINT_LAE1M}
        bert_root: ${LAE_DINO_BERT_ROOT}
        worker_python: ${LAE_DINO_PYTHON}
        stderr_log: ${LAE_DINO_STDERR_LOG}
        score_threshold: 0.20
  counting:
    kind: counting_system
    detector:
      kind: lae_dino_lae1m
      source_root: ${LAE_DINO_SOURCE_ROOT}
      config_path: ${LAE_DINO_CONFIG_LAE1M}
      checkpoint: ${LAE_DINO_CHECKPOINT_LAE1M}
      bert_root: ${LAE_DINO_BERT_ROOT}
      worker_python: ${LAE_DINO_PYTHON}
      stderr_log: ${LAE_DINO_STDERR_LOG}
      score_threshold: 0.0
      top_k: 300
    scale:
      global:
        enabled: false
      native:
        enabled: true
        tile_size: 1333
        overlap: 200
      fine:
        enabled: false
    count:
      score_threshold: 0.20
      nms_iou: 0.40
      cross_scale_iou: 0.50
      keep_raw_proposals: true
      max_detections_per_tile: 300
    gate:
      enabled: false
  semantic_2b:
    kind: qwen3_vl
    backend: huggingface
    model_id: ${QWEN3VL_2B_MODEL_DIR}
    adapter_path: ${QWEN3VL_2B_SEMANTIC_LORA}
    device: auto
    dtype: auto
    local_files_only: true
    max_new_tokens: 128
    # Compatibility fallback only: normal SELECT uses free reasoning followed
    # by KV-cached candidate scoring; Caption/VQA remain unconstrained.
    selection_constrained_decoding: true
  route_4b:
    kind: qwen3_vl
    backend: huggingface
    model_id: ${QWEN3VL_4B_MODEL_DIR}
    device: auto
    dtype: bfloat16
    local_files_only: true
    max_new_tokens: 192
  choice:
    reuse: semantic_2b
  region_retriever:
    # Production UHR path: locator config -> hierarchical beam/refinement -> GeoRSCLIP.
    # The flat `kind: georsclip` form remains available as a baseline/debug adapter.
    kind: uhr_locator
    config_path: configs/locator/uhr_hierarchical.georsclip.yaml

capability_routing:
  ontology_path: configs/eval/semantic/remote_sensing_ontology.json
  unresolved_policy: detector_fallback

locate_refinement:
  enabled: true
  max_candidates: 8
  semantic_weight: 0.75
  geometry_weight: 0.25
  minimum_margin: 0.02

input_composer:
  save_intermediate_artifacts: false
  compact_trace: true
  candidate_halo_ratio: 0.2
  entity_set_union_area_threshold: 0.55
  entity_set_max_side: 1536
  entity_set_max_crops: 16
  route_max_side: 1536

# Auxiliary service only. It reuses semantic_2b and never controls COUNT or graph traversal.
answerability:
  enabled: true
  return_error_result: true
  prompt_version: answerability-v1

choice:
  backend: kv_cached_logits
  single_choice_suffix: "\n\nFinal choice:"
  multi_verify_template: |-
    Verify the following option independently.

    Candidate option {choice_id}: {option_text}
    Is this option a correct answer to the original question?
    Answer YES or NO:
  legacy_regex_fallback: false
  multi_select_threshold: 0.0
  multi_empty_policy: EMPTY
  preserve_reasoning_text: true

semantic_decision:
  enabled: true
  legacy_text_fallback: false
  preserve_reasoning_text: true
  single_decision_suffix: "\n\nCanonical value:"
  multi_select_threshold: 0.0
  uncertainty_epsilon: 0.0
  # Populate only from an existing project ontology or deployment contract.
  attributes: {}

final_vlm_choice_fusion:
  mode: auto
  operators:
    - VLM_REASON
    - MATCH_CHOICE
    - ROUTE_REASON
    - ATTRIBUTE
    - CLASSIFY
    - MULTILABEL_CLASSIFY
    - MOTION
    - RELATION
