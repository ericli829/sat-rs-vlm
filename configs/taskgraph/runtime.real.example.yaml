dataset_policy:
  VRSBench:
    caption: DIRECT_VLM
    captioning: DIRECT_VLM
    vqa: DIRECT_VLM
    visual_question_answering: DIRECT_VLM
    attribute: DIRECT_VLM
    classification: DIRECT_VLM
    count: DIRECT_DETECTION
    counting: DIRECT_DETECTION
    grounding: DIRECT_DETECTION
    visual_grounding: DIRECT_DETECTION
    referring_grounding: DIRECT_DETECTION
    detection: DIRECT_DETECTION
    default: DIRECT_VLM
  LEVIR_CC:
    default: DIRECT_VLM
  MME_RealWorld_RS:
    default: TASKGRAPH_UHR
  XLRS_Bench:
    default: TASKGRAPH_UHR

providers:
  detection:
    kind: tiled
    tile_size: 1333
    overlap_ratio: 0.15
    global_nms_iou: 0.4
    base_provider: lae_dino_lae1m
    base_config:
      source_root: ${LAE_DINO_SOURCE_ROOT}
      config_path: ${LAE_DINO_CONFIG_LAE1M}
      checkpoint: ${LAE_DINO_CHECKPOINT_LAE1M}
      bert_root: ${LAE_DINO_BERT_ROOT}
      worker_python: ${LAE_DINO_PYTHON}
  semantic_2b:
    kind: qwen3_vl
    backend: huggingface
    model_id: ${QWEN3VL_2B_MODEL_DIR}
    device: auto
    dtype: auto
    local_files_only: true
    max_new_tokens: 128
    # Compatibility fallback only: normal SELECT uses free reasoning followed
    # by KV-cached candidate scoring; Caption/VQA remain unconstrained.
    selection_constrained_decoding: true
  route_4b:
    kind: qwen3_vl
    backend: huggingface
    model_id: ${QWEN3VL_4B_MODEL_DIR}
    device: auto
    dtype: bfloat16
    local_files_only: true
    max_new_tokens: 192
  choice:
    reuse: semantic_2b
  region_retriever:
    kind: georsclip
    checkpoint: ${GEORSCLIP_CHECKPOINT}
    model_id: GeoRSCLIP-ViT-B-32
    arch: ViT-B-32
    device: auto
    batch_size: 16
    cache_dir: reports/cache/georsclip
    decoded_image_cache_size: 2
    image_embedding_cache_size: 1024
    grid_size: 3
    candidate_window_ratio: 0.5
    max_candidates: 5

semantic_region_categories:
  - harbor
  - industrial area

input_composer:
  candidate_halo_ratio: 0.2
  entity_set_union_area_threshold: 0.55
  entity_set_max_side: 1536
  route_max_side: 1536

# Auxiliary service only. It reuses semantic_2b and never controls COUNT or graph traversal.
answerability:
  enabled: true
  return_error_result: true
  prompt_version: answerability-v1

choice:
  backend: kv_cached_logits
  single_choice_suffix: "\n\nFinal choice:"
  multi_verify_template: |-
    Verify the following option independently.

    Candidate option {choice_id}: {option_text}
    Is this option a correct answer to the original question?
    Answer YES or NO:
  legacy_regex_fallback: false
  multi_select_threshold: 0.0
  multi_empty_policy: EMPTY
  preserve_reasoning_text: true

semantic_decision:
  enabled: true
  legacy_text_fallback: false
  preserve_reasoning_text: true
  single_decision_suffix: "\n\nCanonical value:"
  multi_select_threshold: 0.0
  uncertainty_epsilon: 0.0
  # Populate only from an existing project ontology or deployment contract.
  attributes: {}

final_vlm_choice_fusion:
  mode: auto
  operators:
    - VLM_REASON
    - MATCH_CHOICE
    - ROUTE_REASON
    - ATTRIBUTE
    - CLASSIFY
    - MULTILABEL_CLASSIFY
    - MOTION
    - RELATION
