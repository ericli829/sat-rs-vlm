dataset_policy:
  VRSBench:
    caption: DIRECT_VLM
    vqa: DIRECT_VLM
    count: DIRECT_DETECTION
    default: DIRECT_VLM
  LEVIR_CC:
    default: DIRECT_VLM
  MME_RealWorld_RS:
    default: TASKGRAPH_UHR
  XLRS_Bench:
    default: TASKGRAPH_UHR

providers:
  planner:
    kind: semantic
    provider: route_4b
  detection:
    kind: tiled
    tile_size: 1333
    overlap_ratio: 0.15
    global_nms_iou: 0.4
    base_provider: lae_dino_lae1m
    base_config:
      source_root: ${LAE_DINO_SOURCE_ROOT}
      config_path: ${LAE_DINO_CONFIG_LAE1M}
      checkpoint: ${LAE_DINO_CHECKPOINT_LAE1M}
      bert_root: ${LAE_DINO_BERT_ROOT}
      worker_python: ${LAE_DINO_PYTHON}
  semantic_2b:
    kind: qwen3_vl
    backend: huggingface
    model_id: ${QWEN3VL_2B_MODEL_DIR}
    device: auto
    dtype: auto
    local_files_only: true
    max_new_tokens: 128
  route_4b:
    kind: qwen3_vl
    backend: huggingface
    model_id: ${QWEN3VL_4B_MODEL_DIR}
    device: auto
    dtype: bfloat16
    local_files_only: true
    max_new_tokens: 192
  choice:
    kind: qwen3_vl
    backend: huggingface
    model_id: ${QWEN3VL_2B_MODEL_DIR}
    device: auto
    dtype: auto
    local_files_only: true
    max_new_tokens: 32
  region_retriever:
    # Selected RS-CLIP baseline. TaskGraph depends only on the capability name.
    kind: georsclip
    checkpoint: ${GEORSCLIP_CHECKPOINT}
    model_id: GeoRSCLIP-ViT-B-32
    arch: ViT-B-32
    device: cuda
    batch_size: 16
    grid_size: 3
    candidate_window_ratio: 0.5
    max_candidates: 5
    cache_dir: reports/cache/georsclip
    decoded_image_cache_size: 2
    image_embedding_cache_size: 1024

semantic_region_categories:
  - harbor
  - industrial area

# Optional Count reject gate; calibrate on the production domain before enabling.
count_gate:
  # Enable only after calibrating GeoRSCLIP scores on the deployment domain.
  enabled: false
  threshold: 0.0
  max_regions: 9
  nms_iou: 0.5
