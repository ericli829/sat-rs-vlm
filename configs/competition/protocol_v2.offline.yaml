# Explicit CPU fixtures for integration checks; never register this in the competition.
runtime_config: runtime.offline.yaml
offline: true
package:
  root: ${COMPETITION_IMAGE_PACKAGE}
server:
  timeout_seconds: 120
  preload: false
routing:
  direct_vlm_max_pixels: 409600
