# Only for protocol smoke tests: these are explicit fixtures, not model predictions.
providers:
  planner:
    kind: fixture
    fixture_file: tests/fixtures/competition/planner.json
  detection:
    kind: fake
    boxes: [[64, 48, 320, 240]]
  counting:
    kind: fake
    boxes: [[64, 48, 320, 240]]
  semantic_2b:
    kind: fake
    default: urban
    responses:
      integer: "3"
      bbox_json: '{"bbox":[0.1,0.1,0.5,0.5],"coordinate_format":"normalized_0_1"}'
    choice_scores:
      competition_enum: {"Yes": 1, "No": -1}
      final_choice: {opt-7: 1, Z: -1, B: -1}
  route_4b:
    kind: fake
    default: urban
    choice_scores:
      competition_enum: {"Yes": 1, "No": -1}
  choice:
    reuse: semantic_2b
  region_retriever:
    kind: fake
    candidates: []
input_composer:
  save_intermediate_artifacts: false
  compact_trace: true
  entity_set_max_side: 1024
  entity_set_max_crops: 4
semantic_decision:
  enabled: true
  legacy_text_fallback: false
final_vlm_choice_fusion:
  mode: "off"
