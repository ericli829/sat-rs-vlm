schema_version: "1.0"
evaluation:
  scope: e_count_v2
  input: data/evaluation/tiers_v2/e_count_v2.jsonl
  output_dir: reports/evaluation/vlm_fo1/grounding_dino
  expected_population: 377
  max_samples: null
data:
  image_root: "${VLM_FO1_IMAGE_ROOT}"
worker:
  python: "${VLM_FO1_PYTHON}"
  script: scripts/integrations/vlm_fo1_worker.py
  backend: official
  runtime_mode: shared_rs_vlm
  proposal_backend: precomputed
  upn_checkpoint: ""
  attention_backend: sdpa
model:
  path: "${VLM_FO1_MODEL}"
  device: cuda
proposal:
  provider: grounding_dino
  model_path: "${GROUNDING_DINO_MODEL}"
  precomputed_file: data/evaluation/proposals/grounding_dino_e_count_v2.jsonl
  cache_dir: "${VLM_FO1_PROPOSAL_CACHE_DIR}"
  box_threshold: 0.3
  text_threshold: 0.25
  nms_threshold: null
  top_k: 100
generation:
  max_new_tokens: 4096
  temperature: 0.0
  top_p: 0.05
  prompt_profile: official_fo1
  count_source: region
provenance:
  audit: reports/integrations/vlm_fo1_source_audit.json
