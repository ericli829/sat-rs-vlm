schema_version: "1.0"
evaluation:
  scope: e_count_v2
  input: data/evaluation/tiers_v2/e_count_v2.jsonl
  output_dir: reports/evaluation/vlm_fo1/e_count_v2
  expected_population: 377
  max_samples: null
data:
  image_root: "${VLM_FO1_IMAGE_ROOT}"
worker:
  python: "${VLM_FO1_PYTHON}"
  script: scripts/integrations/vlm_fo1_worker.py
  backend: official
model:
  path: "${VLM_FO1_MODEL}"
  device: cuda
proposal:
  checkpoint: "${VLM_FO1_UPN_CHECKPOINT}"
  score_threshold: 0.3
  nms_threshold: 0.8
  top_k: 100
generation:
  max_new_tokens: 4096
  temperature: 0.0
  top_p: 0.05
  prompt_profile: official_fo1
provenance:
  audit: reports/integrations/vlm_fo1_source_audit.json
