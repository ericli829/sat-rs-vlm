# 通过 ADAPTER_PATH 分别评测 e1d-data、e1d-sampler 或 e1d-combined。
model:
  base_model: "${MODEL_ROOT}/Qwen3-VL-2B-Instruct"
  adapter_path: "${ADAPTER_PATH}"
  processor_id: "${MODEL_ROOT}/Qwen3-VL-2B-Instruct"
  local_files_only: true
  torch_dtype: "bfloat16"
  device_map: "auto"
data:
  eval_file: "data/processed/e1/qwen3vl_val_balanced_1k.jsonl"
  image_root: "${DATA_ROOT}/VRSBench"
  max_seq_length: 1024
  max_eval_samples: 500
generation:
  do_sample: false
  num_beams: 1
  max_new_tokens: 128
output:
  summary_file: "${OUTPUT_ROOT}/evaluation/e1d/summary.json"
  predictions_file: "${OUTPUT_ROOT}/evaluation/e1d/predictions.jsonl"
