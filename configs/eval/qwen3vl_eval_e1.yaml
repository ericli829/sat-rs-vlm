model:
  base_model: "${MODEL_ROOT}/Qwen3-VL-2B-Instruct"
  adapter_path: "${OUTPUT_ROOT}/training/e1-balanced-r16"
  processor_id: "${MODEL_ROOT}/Qwen3-VL-2B-Instruct"
  local_files_only: true
  torch_dtype: "bfloat16"
  device_map: "auto"
data:
  eval_file: "data/processed/e1/qwen3vl_val_balanced_1k.jsonl"
  image_root: "${DATA_ROOT}/VRSBench"
  max_seq_length: 1024
  max_eval_samples: 500
generation:
  do_sample: false
  num_beams: 1
  max_new_tokens: 128
  task_max_new_tokens: {detection: 64, counting: 16, scene_classification: 32, vqa: 64, captioning: 128}
output:
  summary_file: "${OUTPUT_ROOT}/evaluation/e1/summary.json"
  predictions_file: "${OUTPUT_ROOT}/evaluation/e1/predictions.jsonl"
