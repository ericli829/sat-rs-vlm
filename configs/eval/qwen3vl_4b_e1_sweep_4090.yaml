# Qwen3-VL-4B LR + visual merger sweep 专用 E1 配置。
#
# 该文件只用于本轮新 sweep，不修改历史 baseline 配置。generation、processor、
# E1 数据集和 Evaluation v1.5 contract 与 Unified E1 v2 保持一致；唯一吞吐调整
# 是默认 eval_batch_size=4。正式 runner 若首次 E1 出现 CUDA OOM，只回退到 2。
model:
  base_model: "${QWEN3VL_4B_MODEL_DIR}"
  processor_id: "${QWEN3VL_4B_MODEL_DIR}"
  local_files_only: true
  trust_remote_code: true
  torch_dtype: "bfloat16"
  device_map: "auto"
  attn_implementation: "sdpa"

data:
  eval_file: "data/evaluation/tiers_v2/e1_quick.jsonl"
  image_root: "${DATA_ROOT}"
  max_seq_length: 1024
  max_eval_samples: null
  tiers_manifest: "data/evaluation/tiers_v2/evaluation_tiers_manifest.json"
  eval_batch_size: 4
  group_by_task: true
  log_every_samples: 100

generation:
  max_new_tokens: 256
  do_sample: false
  temperature: 0.0
  num_beams: 1

evaluation:
  contract: "configs/eval/evaluation_contract_v1.5.yaml"
  tier: "E1"
  tier_version: "unified-v2"
  tiers_manifest: "data/evaluation/tiers_v2/evaluation_tiers_manifest.json"
  strict: true
  semantic: true

output:
  summary_file: "reports/eval/qwen3vl_4b_e1_sweep_4090_summary.json"
  predictions_file: "reports/eval/qwen3vl_4b_e1_sweep_4090_predictions.jsonl"
  evaluation_dir: "reports/evaluation/qwen3vl_4b_e1_sweep_4090"
