model:
  base_model: "${QWEN3VL_2B_MODEL_DIR}"
  adapter_path: null
  processor_id: "${QWEN3VL_2B_MODEL_DIR}"
  local_files_only: true
  trust_remote_code: true
  torch_dtype: "bfloat16"
  device_map: "auto"
  attn_implementation: "sdpa"

data:
  # Future formal submissions use Unified VRSBench + LEVIR-CC E2 v2.
  eval_file: "data/evaluation/tiers_v2/e2_standard.jsonl"
  image_root: "${DATA_ROOT}"
  max_seq_length: 1024
  max_eval_samples: null
  eval_batch_size: 1
  group_by_task: true
  tiers_manifest: "data/evaluation/tiers_v2/evaluation_tiers_manifest.json"

generation:
  max_new_tokens: 256
  do_sample: false
  temperature: 0.0
  num_beams: 1

evaluation:
  contract: "configs/eval/evaluation_contract_v1.5.yaml"
  tier: "E2"
  tier_version: "unified-v2"
  tiers_manifest: "data/evaluation/tiers_v2/evaluation_tiers_manifest.json"
  strict: true
  semantic: true
  latency_semantics: "single_sample"

performance:
  enabled: true

output:
  summary_file: "reports/eval/qwen3vl_eval_summary.json"
  predictions_file: "reports/eval/qwen3vl_predictions.jsonl"
  evaluation_dir: "reports/evaluation/qwen3vl_eval"
