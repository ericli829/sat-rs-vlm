model:
  base_model: "${MODEL_ROOT}/Qwen3-VL-2B-Instruct"
  adapter_path: "checkpoints/smoke/qwen3vl-local-smoke"
  processor_id: "${MODEL_ROOT}/Qwen3-VL-2B-Instruct"
  local_files_only: true
  trust_remote_code: true
  torch_dtype: "bfloat16"
  device_map: "auto"
  attn_implementation: "sdpa"

data:
  eval_file: "data/processed/qwen3vl_val.jsonl"
  image_root: "${DATA_ROOT}/VRSBench"
  max_seq_length: 1024
  max_eval_samples: 100

generation:
  max_new_tokens: 256
  # v1.7 keeps LEVIR-CC caption generation free-form. Binary semantics are
  # judged offline by scripts/evaluation/judge_change_captions.py.
  change_binary_enabled: false
  change_binary_max_new_tokens: 8
  do_sample: false
  temperature: 0.0
  num_beams: 1

# Performance statistics are measured on the real generation path after the
# warmup samples. The generated performance_report.json records scope and
# environment so that baseline/quantization comparisons stay reproducible.
performance:
  enabled: true
  # This evaluation entry point uses one independent sample per generation.
  batch_size: 1
  repeats: 1
  warmup_samples: 2
  continue_on_error: true

output:
  summary_file: "reports/eval/qwen3vl_eval_summary.json"
  predictions_file: "reports/eval/qwen3vl_predictions.jsonl"
