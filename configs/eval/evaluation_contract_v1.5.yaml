contract_version: "1.5"
contract_status: frozen
implementation_version: sat-rs-vlm-evaluation-v1.5

upstream_repository:
  url: https://github.com/ericli829/sat-rs-vlm
  branch: master
  commit: da9f6d93b3f848afed68403dad3e0ed26344a626
  commit_short: da9f6d9
  verified_at: "2026-08-11"
  note: "Master commit used as the clean base for the architecture-level integration."
integration_sources:
  evaluation_branch: "feature/evaluation-v1.5@4f66174fb6594b905e75dccdda117e77e422e7aa"
  quantization_branch: "dev-dqt@af6ddbab3652e5f460a0de6da6941ae0be5a5b8f"

metric_labels:
  - official
  - internal
  - human_audit
default_metric_label: internal

optional_profiles:
  repository_native_v2:
    status: implemented_compatibility
    metrics_version: v2_task_metrics
    note: Preserves the repository-native v2 summary as a diagnostic compatibility profile.
  semantic_reference_text_v1:
    status: implemented_internal_only
    contract: configs/eval/semantic/semantic_contract.json
    ontology: configs/eval/semantic/remote_sensing_ontology.json
    note: Reference-text semantic facts only; not image-grounded hallucination evaluation.
  p0_dependency_free_extended_v1:
    status: implemented_internal_only
    note: Dependency-free lexical, spatial, counting-bias, caption and binary diagnostics.

protocols:
  vrsbench_visual_grounding:
    kind: visual_grounding
    status: implemented
    metric_profile: continuous_normalized_v2
    official_profiles:
      vrsbench_grounding_v1:
        status: implemented
        coordinate_source_format: scaled_0_100
        metrics: [Acc@0.5, Acc@0.7]
        stratification: [unique, non_unique, all]
        source_repository: https://github.com/lx709/VRSBench
        source_commit: 56e1ed1baabaaafef19b07fa937cfbdc1924e922
        evaluator: eval_fianl/compute_metrics.ipynb
  vrsbench_counting:
    kind: counting
    status: implemented
    metric_profile: counting_internal_v2
  vrsbench_open_vqa:
    kind: text
    status: implemented_internal_only
    metric_profile: normalized_text_internal_v2
  vrsbench_detailed_caption:
    kind: caption
    status: implemented_internal_only
    metric_profile: caption_approx_internal_v2
  levir_cc_change_caption:
    kind: change_caption
    status: implemented_internal_only
    metric_profile: levir_cc_change_internal_v2
  generic_single_target_grounding_internal:
    kind: visual_grounding
    status: implemented_internal_only
    metric_profile: continuous_normalized_v2
  generic_counting_internal:
    kind: counting
    status: implemented_internal_only
    metric_profile: counting_internal_v2
  generic_text_internal:
    kind: text
    status: implemented_internal_only
    metric_profile: normalized_text_internal_v2
  generic_captioning_internal:
    kind: caption
    status: implemented_internal_only
    metric_profile: caption_approx_internal_v2
  generic_change_captioning_internal:
    kind: caption
    status: implemented_internal_only
    metric_profile: change_caption_approx_internal_v2
  segmentation_not_implemented:
    kind: unimplemented
    status: registered_not_implemented
    metric_profile: null
  unknown_not_implemented:
    kind: unimplemented
    status: registered_not_implemented
    metric_profile: null
  mme_realworld_rs_mcq:
    kind: official_mcq_single
    status: implemented
    metric_profile: mme_realworld_official_v1
    metric_label: official
    official_protocol:
      benchmark: MME-RealWorld
      task: Remote Sensing
      answer_space: "A-E"
      prompt_profile: mme_realworld_official_mcq_v1
      scoring: exact_match_on_official_choice
      aggregation: weighted_micro_accuracy_by_question
      source_repository: https://github.com/MME-Benchmarks/MME-RealWorld
      source_commit: bee58edb82c883843ae93be61c2ae3b452c781d1
      evaluator: evaluation/eval_your_results.py
      parser: lmms_eval/tasks/mme_realworld/utils.py
  xlrs_vqa_mcq:
    kind: official_mcq_single
    status: implemented
    metric_profile: xlrs_lmms_eval_v1
    metric_label: official
    official_protocol:
      benchmark: XLRS-Bench
      task: VQA
      answer_space: "A-D"
      prompt_profile: xlrs_bench_official_vqa_v1
      scoring: exact_match_on_official_choice
      aggregation: micro_accuracy_and_macro_subtask_accuracy
      source_repository: https://github.com/AI9Stars/XLRS-Bench
      source_commit: 828ac0ae8f200f6b05ac9ab12554caee6078e336
      evaluator: lmms-eval/tasks/xlrs/mcq_utils.py
  xlrs_vqa_multiselect:
    kind: official_mcq_multiselect
    status: implemented
    metric_profile: xlrs_lmms_eval_v1
    metric_label: official
    official_protocol:
      benchmark: XLRS-Bench
      task: Overall Land Use Classification
      answer_space: "A-D set"
      prompt_profile: xlrs_bench_official_multiselect_v1
      scoring: exact_set_match
      aggregation: micro_accuracy_and_macro_subtask_accuracy
      source_repository: https://github.com/AI9Stars/XLRS-Bench
      source_commit: 828ac0ae8f200f6b05ac9ab12554caee6078e336
      evaluator: lmms-eval/tasks/xlrs/mcq_utils.py
