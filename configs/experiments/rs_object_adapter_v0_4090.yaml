# RS Object Adapter v0: frozen Qwen3-VL-4B R1 visual tower + new object adapter.
# The R1 checkpoint is supplied with --checkpoint-dir on the target machine; the
# relative default keeps this repository free of machine-specific absolute paths.
experiment:
  name: rs_object_adapter_v0_4090
  seed: 42

model:
  checkpoint_dir: "outputs/checkpoints/qwen3vl_4b_r1/final_adapter"
  local_files_only: true
  trust_remote_code: true
  torch_dtype: "bfloat16"
  device_map: "auto"
  attn_implementation: "sdpa"
  expected_num_blocks: 24
  expected_hidden_size: 1024
  selected_blocks: [5, 11, 17, 23]

data:
  train_source: "data/processed/multisource/qwen3vl_4b_stage_a_v2/legal_vrs_train.jsonl"
  protected_eval_source: "data/processed/multisource/vrsbench_levircc_eval_full.jsonl"
  evaluation_tier_manifest: "data/evaluation/tiers_v2/evaluation_tiers_manifest.json"
  output_dir: "data/processed/rs_object_adapter_v0"
  manifest: "data/processed/rs_object_adapter_v0/manifest.json"
  image_root: "${DATA_ROOT}"
  internal_val_fraction: 0.05
  detection_dedup_iou: 0.95

adapter:
  num_queries: 64
  d_model: 256
  nhead: 8
  decoder_layers: 2
  dim_feedforward: 1024
  dropout: 0.1

loss:
  objectness_weight: 1.0
  bbox_l1_weight: 5.0
  giou_weight: 2.0
  count_weight: 1.0
  binarization_weight: 0.01
  negative_query_weight: 0.1
  smooth_l1_beta: 1.0

training:
  output_dir: "outputs/experiments/rs_object_adapter_v0_4090"
  epochs: 2
  batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 0.0002
  weight_decay: 0.01
  warmup_ratio: 0.05
  scheduler: "constant_after_warmup"
  max_grad_norm: 1.0
  bf16: true
  num_workers: 8
  pin_memory: true
  persistent_workers: true

evaluation:
  batch_size: 4
  output_dir: "outputs/experiments/rs_object_adapter_v0_4090/evaluation_e2"
