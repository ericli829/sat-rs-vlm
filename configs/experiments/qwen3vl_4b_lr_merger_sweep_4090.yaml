# Qwen3-VL-4B 快速诊断矩阵定义。
# 训练细节继续由 base_training_config 指向的正式 Qwen 配置解析。
base_training_config: "configs/train/qwen3vl_4b_vit_probe_last2_4090.yaml"
probe_dataset: "data/processed/experiments/qwen3vl_4b_vit_probe/train.jsonl"
probe_manifest: "data/processed/experiments/qwen3vl_4b_vit_probe/manifest.json"
probe_source_train_files:
  - "data/processed/multisource/qwen3vl_4b_stage_a/round_001_train.jsonl"
protected_evaluation_manifest: "data/evaluation/tiers_v2/evaluation_tiers_manifest.json"
evaluation_config: "configs/eval/qwen3vl_4b_e1_sweep_4090.yaml"

common:
  max_steps: 100
  batch_size: 4
  gradient_accumulation_steps: 4
  max_seq_length: 1024
  seed: 42
  bf16: true
  fp16: false
  gradient_checkpointing: true
  vision_lr: 1.0e-6
  eval_batch_size: 4

experiments:
  A1:
    label: "LoRA LR 2e-5"
    lora_lr: 2.0e-5
    main_merger: false
    vit_last_n: 0
  A2:
    label: "LoRA LR 5e-5"
    lora_lr: 5.0e-5
    main_merger: false
    vit_last_n: 0
  A3:
    label: "LoRA LR 1e-4"
    lora_lr: 1.0e-4
    main_merger: false
    vit_last_n: 0
  B1:
    label: "Main merger 1e-5"
    lora_lr: auto_from_phase_a
    merger_lr: 1.0e-5
    main_merger: true
    vit_last_n: 0
  B2:
    label: "Main merger 3e-5"
    lora_lr: auto_from_phase_a
    merger_lr: 3.0e-5
    main_merger: true
    vit_last_n: 0
  B3:
    label: "Main merger + ViT last2"
    lora_lr: auto_from_phase_a
    merger_lr: 1.0e-5
    main_merger: true
    vit_last_n: 2
