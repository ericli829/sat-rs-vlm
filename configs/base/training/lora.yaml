lora:
  enabled: true
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  method: lora
  seed: 42
  freeze_vision_encoder: true
  freeze_projector: false
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 0.0001
  warmup_ratio: 0.03
  weight_decay: 0.01
  num_train_epochs: 2
  max_steps: null
  gradient_checkpointing: true
  fp16: null
  bf16: null
  logging_steps: 10
  eval_steps: 200
  save_steps: 200
  save_total_limit: 2
  max_grad_norm: 1.0
  lr_scheduler_type: cosine
  resume_from_checkpoint: null

evaluation:
  do_eval: true
  predict_with_generate: true
  max_new_tokens: 256
  num_beams: 1
