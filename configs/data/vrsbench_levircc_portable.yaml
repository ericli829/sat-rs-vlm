# Cross-platform multi-source preparation. DATA_ROOT must contain VRSBench/ and LEVIR-CC/.
common_image_root: "${DATA_ROOT}"
seed: 42

output:
  train_file: "data/processed/multisource/vrsbench_levircc_train.jsonl"
  validation_file: "data/processed/multisource/vrsbench_levircc_val.jsonl"
  report_file: "data/processed/multisource/vrsbench_levircc_report.json"

evaluation:
  full_population_file: "data/processed/multisource/vrsbench_levircc_eval_full.jsonl"
  full_population_report: "data/processed/multisource/vrsbench_levircc_eval_full_report.json"

sources:
  - name: "VRSBench"
    image_root: "${DATA_ROOT}/VRSBench"
    train_file: "data/processed/qwen3vl_train.jsonl"
    validation_file: "data/processed/qwen3vl_val.jsonl"
    validation_samples: 1024
    validation_group_by_images: false
    training_group_by_images: true
    training_task_quotas:
      detection: 12000
      counting: 8000
      captioning: 6000
      vqa: 13720
      scene_classification: 1200

  - name: "LEVIR-CC"
    image_root: "${DATA_ROOT}/LEVIR-CC"
    train_file: "${DATA_ROOT}/LEVIR-CC/annotations/levircc_train.jsonl"
    validation_file: "${DATA_ROOT}/LEVIR-CC/annotations/levircc_val.jsonl"
    validation_samples: 1333
    validation_group_by_images: true
    training_samples_per_image_group: 2
    instruction_override: >-
      The first image is before the change and the second image is after the
      change. Describe all visible changes concisely. If there is no change,
      state that clearly.
