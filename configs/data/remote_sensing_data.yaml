source: vrsbench

raw_data:
  vrsbench:
    root: "d:/project/database/VRSBench"
    train_images: "Images/Images_train"
    val_images: "Images/Images_val"
    train_annotations: "Annotations/Annotations_train"
    val_annotations: "Annotations/Annotations_val"
    official_train: "official/VRSBench_train.json"
    official_eval_caption: "official/VRSBench_EVAL_Cap.json"
    official_eval_referring: "official/VRSBench_EVAL_referring.json"
    official_eval_vqa: "official/VRSBench_EVAL_vqa.json"
    include_caption: true
    include_detection: true
    include_qa: true
    coordinate_policy: "clip_0_1"
    ignore_patterns:
      - "__MACOSX"
      - "._*"

processed:
  output_dir: "data/processed"
  train_file: "data/processed/rs_train.jsonl"
  val_file: "data/processed/rs_val.jsonl"
  test_file: "data/processed/rs_test.jsonl"
  qwen_train_file: "data/processed/qwen3vl_train.jsonl"
  qwen_val_file: "data/processed/qwen3vl_val.jsonl"
  qwen_test_file: "data/processed/qwen3vl_test.jsonl"

split:
  strategy: "official"
  note: "VRSBench train/val are preserved; no independent test annotation is provided."
