# Formal SEU sensitivity experiment: Evaluation v1.5 + paired Bootstrap comparison.
experiment:
  name: qwen3vl_v15_seu_sensitivity
  seed: 20260814
model:
  base_model: ${MODEL_ROOT}/Qwen3-VL-2B-Instruct
  processor_id: ${MODEL_ROOT}/Qwen3-VL-2B-Instruct
  adapter_path: ${OUTPUT_ROOT}/training/lora_baseline/best_adapter
  local_files_only: true
  trust_remote_code: true
  device_map: auto
  torch_dtype: float16
  attn_implementation: sdpa
data:
  dataset_root: ${DATA_ROOT}
  eval_manifest: ${DATA_ROOT}/project_metadata/reliability/vrsbench_levircc_eval.jsonl
  max_eval_samples: 120
  max_seq_length: 1024
  eval_batch_size: 16
  group_by_task: true
  log_every_samples: 20
generation:
  do_sample: false
  num_beams: 1
  max_new_tokens: 128
evaluation:
  contract: configs/eval/evaluation_contract_v1.5.yaml
  tier: E1
  tiers_manifest: data/evaluation/tiers/evaluation_tiers_manifest.json
  semantic: false
fault:
  execution_order: coverage_first
  # Default study scans the language model one layer at a time. The LoRA
  # adapter remains loaded for inference and is also included as a fault target.
  sensitivity_targets: [language_model, attention, mlp, vision_encoder, visual_blocks, visual_merger, embeddings, lora_adapter]
  # Applies to layered language/LoRA targets. Non-layered targets scan all
  # matching parameters when this list is empty.
  layer_indices: auto
  bit_flip_counts: [1, 10, 100]
  repeats: 3
  bit_planes: [sign, exponent, mantissa]
