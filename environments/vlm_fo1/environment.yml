name: vlm-fo1
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      - torch==2.6.0
      - torchvision==0.21.0
      - transformers==4.50.1
      - timm==1.0.9
      - accelerate==1.4.0
      - mmengine==0.8.2
      - gradio
      - einops
      - ninja
      - scikit-image
      - decord
      - scikit-learn
      - matplotlib
      # UPN ops are installed from the official VLM-FO1 checkout separately.
